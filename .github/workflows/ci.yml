name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate GitHub setup scripts
        shell: pwsh
        run: |
          $setupPaths = @(
            "./scripts/setup-github.ps1",
            "./scripts/setup-template-repository.ps1"
          )

          foreach ($path in $setupPaths) {
            $resolvedPath = (Resolve-Path $path).Path
            $bytes = [System.IO.File]::ReadAllBytes($resolvedPath)
            if (
              $bytes.Length -lt 3 -or
              $bytes[0] -ne 0xEF -or
              $bytes[1] -ne 0xBB -or
              $bytes[2] -ne 0xBF
            ) {
              Write-Error "$path must be UTF-8 with BOM for Windows PowerShell 5.1 compatibility."
              exit 1
            }
          }

          $hasErrors = $false
          Get-ChildItem "./scripts" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $hasErrors = $true
              $parseErrors | ForEach-Object {
                Write-Error "$($_.Name): $($_.Message)"
              }
            }
          }

          if ($hasErrors) {
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Diagnose template environment
        run: npm run doctor

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Quality gate
        run: npm run check

      - name: Browser keyboard E2E
        run: npm run test:e2e

      - name: Sampleless template smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- \
            "app/(sample)" \
            "features/todos" \
            "supabase/sample/todos.sql" \
            "tests/sample.test.mjs" \
            "e2e/sample-todos.spec.mjs" \
            ".next"
          npm run check
