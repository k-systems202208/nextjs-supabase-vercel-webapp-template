name: Apply Priority A docs

on:
  push:
    branches:
      - chore/31-align-runtime-e2e-docs

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Align Getting Started and Development
        shell: python
        run: |
          from pathlib import Path

          def replace_required(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_required(
              "GETTING-STARTED.md",
              "- Node.js 22以上27未満",
              "- Node.js 22系（CIもNode.js 22で検証）",
          )
          replace_required(
              "GETTING-STARTED.md",
              "このテンプレートでは、Todoサンプルを次の4か所へ分離しています。",
              "このテンプレートでは、Todoサンプルを次の5グループへ分離しています。",
          )
          replace_required(
              "GETTING-STARTED.md",
              "app/(sample)/dashboard/       Todoサンプル画面（URLは /dashboard）\nfeatures/todos/               Todo用Server Action\nsupabase/sample/todos.sql     Todoテーブル / GRANT / RLS\ntests/sample.test.mjs         Todoサンプル専用テスト",
              "app/(sample)/                Todoサンプル画面 + Todo専用E2E fixture API\nfeatures/todos/              Todo用Server Action + E2E fixture store\nsupabase/sample/todos.sql    Todoテーブル / GRANT / RLS\ntests/sample.test.mjs        Todoサンプル専用契約テスト\ne2e/sample-todos.spec.mjs    Todoサンプル専用ブラウザE2E",
          )
          replace_required(
              "GETTING-STARTED.md",
              'S --> S1["dashboard / todos / sample SQL / sample test"]',
              'S --> S1["sample画面 / todos / sample SQL / sample test / sample E2E"]',
          )
          replace_required(
              "GETTING-STARTED.md",
              "Todoを使わない場合は、サンプル4か所をまとめて削除して構いません。",
              "Todoを使わない場合は、サンプル5グループをまとめて削除して構いません。",
          )
          replace_required(
              "GETTING-STARTED.md",
              "app/(sample)/dashboard/\nfeatures/todos/\nsupabase/sample/todos.sql\ntests/sample.test.mjs",
              "app/(sample)/\nfeatures/todos/\nsupabase/sample/todos.sql\ntests/sample.test.mjs\ne2e/sample-todos.spec.mjs",
          )
          replace_required(
              "GETTING-STARTED.md",
              "Todoサンプルを削除した場合でも、`tests/sample.test.mjs` を一緒に削除していれば共通基盤テストだけで `npm run check` を継続できます。",
              "Todoサンプルを削除する場合は、`tests/sample.test.mjs` と `e2e/sample-todos.spec.mjs` も一緒に削除します。共通基盤の契約テストとAuth E2EはTodoサンプルに依存しません。",
          )
          replace_required(
              "docs/DEVELOPMENT.md",
              "- Node.jsが22以上27未満か",
              "- Node.js 22系か",
          )
          replace_required(
              "docs/DEVELOPMENT.md",
              "- PlaywrightはE2Eコマンド内で固定バージョンを指定し、更新時はBrowser E2Eを必ず通す",
              "- PlaywrightはdevDependencyとして固定し、package-lock.jsonで再現可能にする。更新時はBrowser E2Eを必ず通す",
          )

      - name: Commit documentation changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- GETTING-STARTED.md docs/DEVELOPMENT.md; then
            echo "Documentation is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GETTING-STARTED.md docs/DEVELOPMENT.md
          git commit -m "Issue #31 Browser E2E後のドキュメントを整合"
          git push origin HEAD:chore/31-align-runtime-e2e-docs
